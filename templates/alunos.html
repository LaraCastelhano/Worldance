{% extends "base.html" %}
{% block conteudo %}
<h2>Alunos</h2>
<p><a href="{{ url_for('novo_aluno') }}">Registar novo aluno</a></p>

{% if alunos %}
<table border="1" cellpadding="6">
  <tr><th>Nome</th><th>Email</th><th>Telefone</th></tr>
  {% for a in alunos %}
  <tr>
    <td>{{ a.nome }}</td>
    <td>{{ a.email }}</td>
    <td>{{ a.telefone or "-" }}</td>
  </tr>
  {% endfor %}
</table>
{% else %}
<p>Ainda não existem alunos registados.</p>
{% endif %}
{% endblock %}

<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Worldance</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <aside class="sidebar">
    <div class="logo">Worldance</div>
    <nav>
      <a href="{{ url_for('listar_alunos') }}"
         class="{% if request.endpoint in ('listar_alunos', 'novo_aluno') %}ativo{% endif %}">Alunos</a>
    </nav>
  </aside>

  <div class="principal">
    <header class="topo">Bem-vinda, Direção</header>
    <main class="conteudo">
      {% for mensagem in get_flashed_messages() %}
        <p class="sucesso">{{ mensagem }}</p>
      {% endfor %}
      {% block conteudo %}{% endblock %}
    </main>
  </div>
</body>
</html>
